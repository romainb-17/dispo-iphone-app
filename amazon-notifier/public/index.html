<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Amazon Notifier</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 24px; color: #111; }
    h1 { margin: 0 0 8px; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin: 12px 0; }
    label { display:block; margin: 8px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #111827; color: #fff; cursor: pointer; }
    button.secondary { background: #374151; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 680px){ .row{ grid-template-columns: 1fr; } }
    .muted { color:#6b7280; }
    .ok { color: #059669; font-weight: 700; }
    .err { color: #b91c1c; font-weight: 700; }
    table { width:100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; }
    small code { background:#f3f4f6; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>🔔 Amazon Notifier</h1>
  <p class="muted">Recevez un email quand un article passe <em>en stock</em> ou sous un <em>prix</em> donné.</p>

  <div class="card">
    <h2>Ajouter une surveillance</h2>
    <div class="row">
      <div>
        <label for="asin">ASIN Amazon.fr</label>
        <input id="asin" placeholder="ex: B0CXXXXXXX" />
      </div>
      <div>
        <label for="email">Email destinataire</label>
        <input id="email" placeholder="toi@exemple.fr" />
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <div>
        <label for="price">Prix max (optionnel)</label>
        <input id="price" type="number" min="0" step="0.01" placeholder="ex: 799" />
      </div>
      <div style="display:flex;align-items:end;gap:8px;">
        <button id="btnWatch">+ Ajouter</button>
        <span id="watchMsg" class="muted"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Tester un ASIN</h2>
    <div class="row">
      <div>
        <label for="asinTest">ASIN à tester</label>
        <input id="asinTest" placeholder="ex: B0CXXXXXXX" />
      </div>
      <div style="display:flex;align-items:end;gap:8px;">
        <button id="btnTest" class="secondary">Tester</button>
        <span id="testMsg" class="muted"></span>
      </div>
    </div>
    <pre id="testJson" class="muted" style="white-space:pre-wrap;"></pre>
  </div>

  <div class="card">
    <h2>Mes surveillances</h2>
    <button id="btnRefresh" class="secondary">Rafraîchir</button>
    <div id="list" class="muted" style="margin-top:8px;">Chargement…</div>
  </div>

  <p class="muted">
    ⚙️ API: <small><code>POST /watch</code></small>,
    <small><code>GET /debug/list</code></small>,
    <small><code>GET /api/amazon/check?asin=…</code></small>
  </p>

<script>
const $ = (id)=>document.getElementById(id);

async function postJSON(url, data){
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
  if(!r.ok) throw new Error((await r.text())||r.statusText);
  return r.json();
}
async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error((await r.text())||r.statusText);
  return r.json();
}

async function refreshList(){
  $('list').textContent = 'Chargement…';
  try{
    const data = await getJSON('/debug/list');
    const items = data.items || [];
    if(!items.length){ $('list').textContent = 'Aucune surveillance pour le moment.'; return; }
    const rows = items.map(x=>`
      <tr>
        <td><a href="https://www.amazon.fr/dp/${x.asin}" target="_blank" rel="noopener">${x.asin}</a></td>
        <td>${x.email}</td>
        <td>${x.priceMax ?? '—'}</td>
        <td>${x.lastState ?? '—'}</td>
        <td>${x.updatedAt ? new Date(x.updatedAt).toLocaleString() : '—'}</td>
      </tr>`).join('');
    $('list').innerHTML = `
      <table>
        <thead><tr><th>ASIN</th><th>Email</th><th>Prix max</th><th>Dernier état</th><th>Maj</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }catch(e){
    $('list').innerHTML = `<span class="err">Erreur:</span> ${e.message}`;
  }
}

$('btnWatch').addEventListener('click', async ()=>{
  const asin = $('asin').value.trim();
  const email = $('email').value.trim();
  const priceMax = $('price').value.trim();
  $('watchMsg').textContent = '…';
  try{
    if(!asin || !email) throw new Error('ASIN et Email requis');
    const payload = { asin, email };
    if(priceMax) payload.priceMax = Number(priceMax);
    await postJSON('/watch', payload);
    $('watchMsg').innerHTML = '<span class="ok">Ajouté ✔︎</span>';
    $('asin').value=''; $('price').value='';
    refreshList();
  }catch(e){
    $('watchMsg').innerHTML = '<span class="err">Erreur:</span> '+e.message;
  }
});

$('btnTest').addEventListener('click', async ()=>{
  const asin = $('asinTest').value.trim();
  $('testMsg').textContent = '…';
  $('testJson').textContent = '';
  try{
    if(!asin) throw new Error('ASIN requis');
    const r = await getJSON('/api/amazon/check?asin='+encodeURIComponent(asin));
    $('testMsg').innerHTML = '<span class="ok">OK</span>';
    $('testJson').textContent = JSON.stringify(r, null, 2);
  }catch(e){
    $('testMsg').innerHTML = '<span class="err">Erreur</span>';
    $('testJson').textContent = e.message;
  }
});

$('btnRefresh').addEventListener('click', refreshList);
refreshList();
</script>
</body>
</html>
